<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIAN00001 / HYPERION SYSTEMS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #020101;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" width="100%" height="100%">
            <defs>
                <radialGradient id="cyberBg" cx="50%" cy="50%" r="70%">
                    <stop offset="0%" stop-color="#1a1008"/>
                    <stop offset="40%" stop-color="#0d0804"/>
                    <stop offset="100%" stop-color="#020101"/>
                </radialGradient>
                
                <linearGradient id="scanLine" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffa238" stop-opacity="0"/>
                    <stop offset="50%" stop-color="#ffa238" stop-opacity="0.08"/>
                    <stop offset="100%" stop-color="#ffa238" stop-opacity="0"/>
                </linearGradient>

                <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffa238"/>
                    <stop offset="50%" stop-color="#ffcc80"/>
                    <stop offset="100%" stop-color="#ff8f00"/>
                </linearGradient>

                <linearGradient id="glassReflect" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
                    <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                </linearGradient>

                <filter id="premiumGlow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="8" result="blur1" />
                    <feGaussianBlur stdDeviation="18" result="blur2" />
                    <feGaussianBlur stdDeviation="30" result="blur3" />
                    <feMerge>
                        <feMergeNode in="blur3" />
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="shadowWindow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.98"/>
                    <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#ff8f00" flood-opacity="0.1"/>
                </filter>

                <filter id="glowText" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <filter id="goldenBorder">
                    <feGaussianBlur stdDeviation="4" result="blur"/>
                    <feComponentTransfer in="blur" result="glow">
                        <feFuncA type="linear" slope="1.5"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode in="glow"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <clipPath id="clipLine">
                    <rect x="80" y="0" width="0" height="40">
                        <animate attributeName="width" from="0" to="800" begin="0.3s" dur="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
                    </rect>
                </clipPath>

                <clipPath id="imageClip">
                    <rect x="122" y="352" width="756" height="536" rx="10"/>
                </clipPath>

                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffa238" stroke-width="0.3" opacity="0.06"/>
                </pattern>

                <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
                    <circle cx="2" cy="2" r="0.8" fill="#ffa238" opacity="0.08"/>
                </pattern>
            </defs>

            <style>
                .term-text { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #b89670; }
                .cmd-text { font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: bold; fill: #ffa238; }
                .success-text { font-family: 'Courier New', Courier, monospace; font-size: 13px; fill: #4af266; }
                .matrix-code { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #e5a952; opacity: 0.1; letter-spacing: 2px; }
                .hud-text { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #ffa238; opacity: 0.5; letter-spacing: 3px; }
                .data-stream { font-family: 'Courier New', Courier, monospace; font-size: 9px; fill: #4af266; opacity: 0; }
            </style>

            <rect width="1000" height="1050" fill="url(#cyberBg)" />
            
            <rect width="1000" height="1050" fill="url(#grid)" />
            <rect width="1000" height="1050" fill="url(#dots)" />

            <rect width="1000" height="1050" fill="url(#scanLine)">
                <animate attributeName="y" from="-1050" to="1050" dur="3s" repeatCount="indefinite"/>
            </rect>

            <g opacity="0.25">
                <text x="30" y="0" class="matrix-code">SYS::CORE_INIT_0x7F<animate attributeName="y" from="-50" to="1100" dur="13s" repeatCount="indefinite"/></text>
                <text x="130" y="0" class="matrix-code">ARIAN00001::DEPLOY<animate attributeName="y" from="-50" to="1100" dur="11s" repeatCount="indefinite" begin="1.5s"/></text>
                <text x="260" y="0" class="matrix-code">0x9FBC771A2D03EE5F<animate attributeName="y" from="-50" to="1100" dur="15s" repeatCount="indefinite" begin="0.5s"/></text>
                <text x="410" y="0" class="matrix-code">PREMIUM_FRAME_BUFFER<animate attributeName="y" from="-50" to="1100" dur="10s" repeatCount="indefinite" begin="2s"/></text>
                <text x="580" y="0" class="matrix-code">HDR_SHADOW_MAP_ACTIVE<animate attributeName="y" from="-50" to="1100" dur="14s" repeatCount="indefinite" begin="3s"/></text>
                <text x="720" y="0" class="matrix-code">GOLDEN_HOUR_LIGHTING<animate attributeName="y" from="-50" to="1100" dur="12s" repeatCount="indefinite" begin="2.5s"/></text>
                <text x="870" y="0" class="matrix-code">RENDER_ENGINE_v4.5<animate attributeName="y" from="-50" to="1100" dur="9s" repeatCount="indefinite" begin="4s"/></text>
                <text x="940" y="0" class="matrix-code">ULTRA_SETTINGS_OK<animate attributeName="y" from="-50" to="1100" dur="16s" repeatCount="indefinite" begin="0.8s"/></text>
            </g>

            <g filter="url(#premiumGlow)">
                <circle cx="200" cy="300" r="1.5" fill="#ffa238" opacity="0">
                    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite" begin="0s"/>
                    <animate attributeName="cy" from="300" to="200" dur="3s" repeatCount="indefinite" begin="0s"/>
                </circle>
                <circle cx="800" cy="500" r="1" fill="#ffcc80" opacity="0">
                    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite" begin="1s"/>
                    <animate attributeName="cy" from="500" to="400" dur="4s" repeatCount="indefinite" begin="1s"/>
                </circle>
                <circle cx="500" cy="700" r="1.2" fill="#ff8f00" opacity="0">
                    <animate attributeName="opacity" values="0;0.7;0" dur="3.5s" repeatCount="indefinite" begin="2s"/>
                    <animate attributeName="cy" from="700" to="600" dur="3.5s" repeatCount="indefinite" begin="2s"/>
                </circle>
            </g>

            <g filter="url(#shadowWindow)">
                <rect x="60" y="60" width="880" height="930" rx="24" fill="#120c08" stroke="url(#goldGradient)" stroke-width="2" filter="url(#goldenBorder)"/>
                
                <rect x="63" y="63" width="874" height="924" rx="21" fill="none" stroke="#ffa238" stroke-width="0.5" opacity="0.15"/>
                
                <rect x="60" y="60" width="880" height="930" rx="24" fill="url(#glassReflect)"/>

                <path d="M 60,60 L 60,115 L 940,115 L 940,60 Z" fill="#1a1209" />
                <path d="M 60,114 L 940,114" stroke="#ffa238" stroke-width="1" opacity="0.3"/>
                
                <circle cx="95" cy="88" r="8" fill="#ff5f56" />
                <circle cx="95" cy="88" r="8" fill="none" stroke="#ff5f56" stroke-width="1" opacity="0.5"/>
                <circle cx="120" cy="88" r="8" fill="#ffbd2e" />
                <circle cx="120" cy="88" r="8" fill="none" stroke="#ffbd2e" stroke-width="1" opacity="0.5"/>
                <circle cx="145" cy="88" r="8" fill="#27c93f" />
                <circle cx="145" cy="88" r="8" fill="none" stroke="#27c93f" stroke-width="1" opacity="0.5"/>

                <text x="500" y="93" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#826449" text-anchor="middle" letter-spacing="3">PROJECT_ARIOS // ULTRA_RENDER_ENGINE v4.5</text>

                <g transform="translate(820, 80)">
                    <circle cx="8" cy="8" r="4" fill="#4af266">
                        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="8" cy="8" r="6" fill="none" stroke="#4af266" stroke-width="0.5" opacity="0.5">
                        <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <text x="20" y="12" font-family="'Courier New', monospace" font-size="10" fill="#4af266" font-weight="bold" letter-spacing="1">SECURE</text>
                </g>

                <g transform="translate(0, 150)">
                    <g clip-path="url(#clipLine)">
                        <text x="80" y="25" class="cmd-text" filter="url(#glowText)">arian00001@hyperion:~$ <tspan fill="#ffffff">sh ./load_premium_profile.sh --render=ultra --glow=cinematic</tspan></text>
                    </g>
                </g>

                <text x="80" y="210" class="term-text" opacity="0">
                    <animate attributeName="opacity" to="1" begin="1.5s" dur="0.2s" fill="freeze"/>
                    [sys] Initializing premium render pipeline...
                </text>
                
                <text x="80" y="230" class="term-text" opacity="0">
                    <animate attributeName="opacity" to="1" begin="1.7s" dur="0.2s" fill="freeze"/>
                    [sys] Fetching assets from GitHub repository...
                </text>

                <text x="80" y="250" class="success-text" opacity="0">
                    <animate attributeName="opacity" to="1" begin="2.2s" dur="0.15s" fill="freeze"/>
                    [ok] TLS handshake verified. Connection established.
                </text>

                <g opacity="0">
                    <animate attributeName="opacity" to="1" begin="2.8s" dur="0.3s" fill="freeze"/>
                    <text x="80" y="295" class="term-text">Loading Image from Repository: </text>
                    <rect x="340" y="282" width="350" height="14" rx="7" fill="#1a0f06" stroke="#ffa238" stroke-width="0.5" opacity="0.5"/>
                    <rect x="340" y="282" width="0" height="14" rx="7" fill="url(#goldGradient)">
                        <animate attributeName="width" from="0" to="350" begin="3.0s" dur="1.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.1 1"/>
                    </rect>
                    <text x="700" y="294" class="term-text" font-size="11" fill="#ffa238">0%</text>
                    <text x="700" y="294" class="term-text" font-size="11" fill="#4af266" opacity="0">
                        <animate attributeName="opacity" to="1" begin="4.5s" dur="0.1s" fill="freeze"/>
                        100%
                    </text>
                </g>

                <text x="80" y="330" class="cmd-text" opacity="0" filter="url(#glowText)">
                    <animate attributeName="opacity" to="1" begin="4.6s" dur="0.2s" fill="freeze"/>
                    arian00001@hyperion:~$ <tspan fill="#4af266">./render_image --source=ahona.png</tspan>
                    <animate attributeName="opacity" values="1;0.5;1" dur="0.5s" repeatCount="3" begin="4.6s"/>
                </text>

                <g opacity="0">
                    <animate attributeName="opacity" to="1" begin="4.8s" dur="1s" fill="freeze"/>
                    
                    <path d="M 100,360 L 140,360 M 100,360 L 100,400" stroke="url(#goldGradient)" stroke-width="3" fill="none" opacity="0.8"/>
                    <path d="M 900,360 L 860,360 M 900,360 L 900,400" stroke="url(#goldGradient)" stroke-width="3" fill="none" opacity="0.8"/>
                    <path d="M 100,880 L 140,880 M 100,880 L 100,840" stroke="url(#goldGradient)" stroke-width="3" fill="none" opacity="0.8"/>
                    <path d="M 900,880 L 860,880 M 900,880 L 900,840" stroke="url(#goldGradient)" stroke-width="3" fill="none" opacity="0.8"/>

                    <text x="115" y="340" class="hud-text" text-anchor="middle">FRAME_ACTIVE</text>
                    <text x="885" y="340" class="hud-text" text-anchor="middle">PORT_443</text>
                    <text x="115" y="910" class="hud-text" text-anchor="middle">COMPLEXITY_ULTRA</text>
                    <text x="885" y="910" class="hud-text" text-anchor="middle">FPS_144</text>

                    <polygon points="500,340 510,350 500,360 490,350" fill="none" stroke="#ffa238" stroke-width="1" opacity="0.4">
                        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
                    </polygon>
                    <polygon points="500,880 510,890 500,900 490,890" fill="none" stroke="#ffa238" stroke-width="1" opacity="0.4">
                        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
                    </polygon>
                </g>

                <g opacity="0" filter="url(#premiumGlow)">
                    <animate attributeName="opacity" to="1" begin="5.2s" dur="2s" fill="freeze"/>
                    
                    <rect x="115" y="345" width="770" height="550" rx="16" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.8">
                        <animate attributeName="opacity" values="0.8;0.6;0.8" dur="3s" repeatCount="indefinite"/>
                    </rect>
                    
                    <rect x="118" y="348" width="764" height="544" rx="14" fill="none" stroke="#ffcc80" stroke-width="0.5" opacity="0.3"/>

                    <image href="https://cdn.jsdelivr.net/gh/arian00001/arian00001@main/ahona.png" 
                           x="122" y="352" width="756" height="536" 
                           preserveAspectRatio="xMidYMid slice" 
                           clip-path="url(#imageClip)"/>

                    <rect x="122" y="352" width="756" height="536" rx="10" fill="none" stroke="#ffa238" stroke-width="1" opacity="0.3"/>

                    <path d="M 135,375 L 170,375 M 135,375 L 135,410" stroke="url(#goldGradient)" stroke-width="3" fill="none">
                        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
                    </path>
                    <path d="M 865,375 L 830,375 M 865,375 L 865,410" stroke="url(#goldGradient)" stroke-width="3" fill="none">
                        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
                    </path>
                    <path d="M 135,865 L 170,865 M 135,865 L 135,830" stroke="url(#goldGradient)" stroke-width="3" fill="none">
                        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="1s"/>
                    </path>
                    <path d="M 865,865 L 830,865 M 865,865 L 865,830" stroke="url(#goldGradient)" stroke-width="3" fill="none">
                        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="1.5s"/>
                    </path>

                    <g opacity="0.3">
                        <line x1="500" y1="360" x2="500" y2="380" stroke="#ffa238" stroke-width="0.5"/>
                        <line x1="500" y1="870" x2="500" y2="890" stroke="#ffa238" stroke-width="0.5"/>
                        <line x1="130" y1="625" x2="150" y2="625" stroke="#ffa238" stroke-width="0.5"/>
                        <line x1="850" y1="625" x2="870" y2="625" stroke="#ffa238" stroke-width="0.5"/>
                        <circle cx="500" cy="625" r="3" fill="none" stroke="#ffa238" stroke-width="0.5"/>
                        <circle cx="500" cy="625" r="10" fill="none" stroke="#ffa238" stroke-width="0.3" opacity="0.5"/>
                        <circle cx="500" cy="625" r="20" fill="none" stroke="#ffa238" stroke-width="0.2" opacity="0.3"/>
                    </g>
                </g>

                <g opacity="0">
                    <animate attributeName="opacity" to="0.3" begin="6s" dur="1s" fill="freeze"/>
                    <line x1="122" y1="625" x2="878" y2="625" stroke="#4af266" stroke-width="1" opacity="0.5">
                        <animate attributeName="y1" values="352;888" dur="4s" repeatCount="indefinite" begin="6s"/>
                        <animate attributeName="y2" values="352;888" dur="4s" repeatCount="indefinite" begin="6s"/>
                    </line>
                    <line x1="122" y1="625" x2="878" y2="625" stroke="#4af266" stroke-width="3" opacity="0.2" filter="url(#premiumGlow)">
                        <animate attributeName="y1" values="352;888" dur="4s" repeatCount="indefinite" begin="6s"/>
                        <animate attributeName="y2" values="352;888" dur="4s" repeatCount="indefinite" begin="6s"/>
                    </line>
                </g>

                <path d="M 60,945 L 940,945" stroke="#21150c" stroke-width="2"/>
                <path d="M 60,946 L 940,946" stroke="#ffa238" stroke-width="0.5" opacity="0.2"/>
                
                <text x="80" y="975" class="term-text" font-size="12" fill="#6e5033">
                    RENDER PIPELINE: ULTRA | FRAME BUFFER: 144Hz | STABLE BRANCH | REPO: arian00001/premium
                </text>

                <g transform="translate(700, 965)">
                    <rect x="0" y="0" width="8" height="8" fill="#4af266">
                        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
                    </rect>
                    <text x="14" y="8" font-family="'Courier New', monospace" font-size="10" fill="#4af266" font-weight="bold">RENDER_ACTIVE</text>
                </g>

                <text x="920" y="975" class="term-text" font-size="10" fill="#6e5033" text-anchor="end">v4.5.2-gold</text>
            </g>

            <g transform="translate(880, 20)" opacity="0">
                <animate attributeName="opacity" to="0.8" begin="7s" dur="1s" fill="freeze"/>
                <rect x="0" y="0" width="100" height="20" rx="10" fill="#ffa238" opacity="0.2"/>
                <rect x="0" y="0" width="100" height="20" rx="10" fill="none" stroke="#ffa238" stroke-width="1" opacity="0.6"/>
                <text x="50" y="14" font-family="'Courier New', monospace" font-size="9" fill="#ffa238" font-weight="bold" text-anchor="middle" letter-spacing="2">PREMIUM</text>
            </g>

            <text x="500" y="1040" font-family="'Courier New', monospace" font-size="11" fill="#826449" text-anchor="middle" opacity="0.5" letter-spacing="4">
                ✦ ARIAN00001 / HYPERION SYSTEMS ✦
            </text>
        </svg>
    </div>
</body>
